<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marginalia">
<meta name="theme-color" content="#e9dab5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script>try{if(navigator.standalone||matchMedia("(display-mode: standalone)").matches)document.documentElement.classList.add("standalone")}catch(e){}
(function(){function v(){document.documentElement.style.setProperty("--vh",(window.innerHeight/100)+"px")}v();addEventListener("resize",v);addEventListener("orientationchange",function(){setTimeout(v,300)})})();</script>
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Marginalia — a roguelike deckbuilder in the margins of a medieval manuscript.">
<title>Marginalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>/* ==========================================================================
   MARGINALIA — stylesheet (UI agent)
   An illuminated-manuscript skin for a portrait iPhone deckbuilder.
   Sections: tokens · page/vellum · typography · common widgets · HUD ·
   title · act intro · map · combat (field, foes, hero, margin, tray, hand,
   cards) · reward/rest/pick/treasure/shop/event/end · overlays · fx · motion
   ========================================================================== */

:root {
  --ink: #2a1f1a; --ink2: #3d2e25; --faded: #5c4c3e; --faint: rgba(42,31,26,.18);
  --verm: #b8321f; --lapis: #1f4f96; --verd: #2f7d62; --gold: #c99a1e; --goldhi: #f0d27a; --golddk: #8a6510;
  --flesh: #e9c9a0; --umber: #7a5230; --rose: #c98a8a;
  --vermT: #a12a18; --verdT: #226048; --golddkT: #6f520b; /* text-weight variants: ≥4.5:1 on the darkest parchment */
  --p1: #efe2c4; --p2: #e4d2a8; --p3: #d8c290;
  /* Display face: legible small caps everywhere; blackletter is reserved for the title-page logo only */
  --f-black: 'IM Fell English SC', 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --f-logo: 'UnifrakturMaguntia', 'Old English Text MT', 'Goudy Text MT', Georgia, serif;
  --f-body: 'IM Fell English', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --f-sc: 'IM Fell English SC', 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --cw: min(90px, 23vw); --ch: calc(var(--cw) * 1.42);
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .16  0 0 0 .33 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --fox: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='1000'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.008' numOctaves='4' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .38  0 0 0 0 .16  0 0 0 -2.4 1.25'/></filter><rect width='100%25' height='100%25' filter='url(%23f)'/></svg>");
  --fibre: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='500'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.006 .12' numOctaves='2' seed='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .38  0 0 0 0 .22  0 0 0 -2.2 1.0'/></filter><rect width='100%25' height='100%25' filter='url(%23b)'/></svg>");
  color-scheme: light;
}
/* hand cards scale with the screen: as wide as the width allows, as tall as the height allows */
@supports (height: 1dvh) { :root { --cw: clamp(78px, min(24vw, calc(var(--vh, 1dvh) * 14.6)), 108px); } }

/* ---------- page / vellum ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
/* Pin the page to the real screen. iOS Home-Screen web apps report a short 100vh/calc(var(--vh, 1dvh) * 100)
   (as if a browser toolbar were still there), so nothing below sizes itself from vh/dvh. */
body { position: fixed; inset: 0; }
html { background: var(--p2); }
body {
  font-family: var(--f-body); color: var(--ink); font-size: 16px; line-height: 1.3;
  touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  background:
    radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(110,70,25,.28) 100%),
    var(--grain),
    linear-gradient(172deg, var(--p1) 0%, #ead9b6 45%, var(--p2) 100%);
  background-color: var(--p2);
}
body::before { /* foxing + fibres, fixed so scrolling never repaints them */
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: var(--fox), var(--fibre); background-size: 1000px 1000px, 1000px 500px; opacity: .3; mix-blend-mode: multiply;
}
body::after { /* ruled margins: double rose rule on both edges */
  content: ''; position: fixed; top: 0; bottom: 0; left: 0; right: 0; pointer-events: none; z-index: 0;
  background:
    linear-gradient(90deg, transparent calc(var(--sal) + 7px), rgba(184,50,31,.28) calc(var(--sal) + 7px), rgba(184,50,31,.28) calc(var(--sal) + 8px), transparent calc(var(--sal) + 8px),
      transparent calc(var(--sal) + 10px), rgba(184,50,31,.2) calc(var(--sal) + 10px), rgba(184,50,31,.2) calc(var(--sal) + 11px), transparent calc(var(--sal) + 11px)),
    linear-gradient(270deg, transparent calc(var(--sar) + 7px), rgba(184,50,31,.28) calc(var(--sar) + 7px), rgba(184,50,31,.28) calc(var(--sar) + 8px), transparent calc(var(--sar) + 8px),
      transparent calc(var(--sar) + 10px), rgba(184,50,31,.2) calc(var(--sar) + 10px), rgba(184,50,31,.2) calc(var(--sar) + 11px), transparent calc(var(--sar) + 11px));
}
#app {
  position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
  padding: var(--sat) calc(var(--sar) + 12px) var(--sab) calc(var(--sal) + 12px); overflow: hidden;
}
#fxl { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
#ovl { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
#ovl.on { pointer-events: auto; }
svg { display: block; }
button { font: inherit; color: inherit; touch-action: manipulation; }
b { font-weight: 700; }
.scr { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scr.enter { animation: pageIn .38s ease-out both; }

/* ---------- typography ---------- */
.bl { font-family: var(--f-black); font-weight: 400; letter-spacing: .01em; }
.sc { font-family: var(--f-sc); }
.rub { color: var(--vermT); }
.faded { color: var(--faded); }
h1, h2, h3 { margin: 0; font-weight: 400; }
.h-title { font-family: var(--f-black); font-size: 30px; line-height: 1.05; text-align: center; color: var(--ink); }
.h-sub { font-family: var(--f-sc); font-size: 15px; text-align: center; color: var(--vermT); letter-spacing: .06em; }
.flavor { font-style: italic; color: var(--faded); text-align: center; font-size: 15px; }
.fleuron { color: var(--vermT); text-align: center; font-size: 18px; line-height: 1; margin: 6px 0; opacity: .85; }
.fleuron::before { content: '\2766'; }
.rule { height: 0; border-top: 1px solid rgba(184,50,31,.45); border-bottom: 1px solid rgba(184,50,31,.25); padding-top: 2px; margin: 8px 6px; }
.up { color: var(--verdT); } .down { color: var(--vermT); }
.kw { font-family: var(--f-sc); color: var(--faded); }

/* ---------- common widgets ---------- */
.btn { /* ink-wash button */
  position: relative; min-height: 46px; padding: 10px 18px; border: 1.6px solid var(--ink); cursor: pointer;
  border-radius: 4px 9px 5px 10px / 9px 4px 10px 5px; font-family: var(--f-sc); font-size: 18px; letter-spacing: .03em;
  background:
    radial-gradient(120% 140% at 20% 10%, rgba(255,250,235,.55), transparent 60%),
    linear-gradient(180deg, rgba(42,31,26,.06), rgba(42,31,26,.16));
  box-shadow: 1px 2px 0 rgba(42,31,26,.35), inset 0 0 0 3px rgba(255,248,230,.25);
  transition: transform .08s ease;
}
.btn:active { transform: translate(1px, 2px); box-shadow: 0 0 0 rgba(42,31,26,.35); }
.btn.primary { color: #fff6e2; border-color: #5a1a10; text-shadow: 0 1px 0 rgba(0,0,0,.35);
  background: radial-gradient(120% 140% at 25% 15%, rgba(255,200,170,.35), transparent 55%), linear-gradient(180deg, #c03a24, #8f2414); }
.btn.lapis { color: #f2f2ff; border-color: #102a55; text-shadow: 0 1px 0 rgba(0,0,0,.35);
  background: radial-gradient(120% 140% at 25% 15%, rgba(200,220,255,.35), transparent 55%), linear-gradient(180deg, #2c5fa8, #183d78); }
.btn.gold { color: #3a2604; border-color: var(--golddk);
  background: radial-gradient(120% 140% at 25% 15%, rgba(255,250,210,.8), transparent 55%), linear-gradient(180deg, var(--goldhi), var(--gold)); }
.btn.ghost { background: transparent; box-shadow: none; border-style: dashed; border-color: var(--faded); color: var(--faded); }
.btn[disabled], .btn.off { opacity: .42; filter: grayscale(.6); pointer-events: none; }
.btn.small { min-height: 44px; padding: 6px 12px; font-size: 15px; }
.btn.wide { width: 100%; }
.btn .ic { display: inline-block; width: 20px; height: 20px; vertical-align: -4px; margin-right: 4px; }
.ib { /* icon button */
  width: 44px; height: 44px; border: 0; background: transparent; padding: 9px; cursor: pointer; color: var(--ink); position: relative; flex: none;
}
.ib:active { transform: scale(.92); }
.ib .ic { width: 26px; height: 26px; }
.ib .cnt { position: absolute; right: 1px; bottom: 2px; font-family: var(--f-sc); font-size: 12px; background: var(--p1); border: 1px solid var(--ink); border-radius: 8px; min-width: 18px; padding: 0 3px; line-height: 15px; text-align: center; }
.ic { display: inline-block; width: 20px; height: 20px; color: inherit; flex: none; }
.ic svg { width: 100%; height: 100%; overflow: visible; }
.ph-ic { display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid currentColor; border-radius: 50%; font-family: var(--f-sc); font-size: 11px; line-height: 1; width: 100%; height: 100%; }
.art svg { width: 100%; height: 100%; overflow: visible; }

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: 4px; height: 46px; min-height: 44px; flex: none; position: relative; z-index: 3; }
.hud .stat { display: flex; align-items: center; gap: 3px; font-family: var(--f-sc); font-size: 17px; white-space: nowrap; }
.hud .stat .ic { width: 22px; height: 22px; }
.hud .stat.hp { color: var(--vermT); }
.hud .stat.hp span { color: var(--ink); }
.hud .stat.ag .ic { color: var(--faded); }
.hud .where { flex: 1; text-align: center; font-family: var(--f-sc); font-size: 13px; color: var(--faded); line-height: 1.05; min-width: 0; overflow: hidden; }
.hud .where b { font-family: var(--f-sc); font-weight: 400; color: var(--vermT); font-size: 17px; display: block; letter-spacing: .04em; }
.relics { display: flex; gap: 4px; overflow-x: auto; height: 30px; flex: none; align-items: center; scrollbar-width: none; padding: 0 2px; position: relative; z-index: 3; }
.relics::-webkit-scrollbar { display: none; }
.relic { width: 28px; height: 28px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative;
  background: radial-gradient(circle at 35% 30%, #fff8dd, var(--goldhi) 40%, var(--gold) 80%, var(--golddk)); border: 1.4px solid var(--ink);
  box-shadow: 0 1px 2px rgba(42,31,26,.4); font-family: var(--f-black); font-size: 15px; color: var(--vermT); line-height: 1; }
.relic .ic { width: 20px; height: 20px; color: var(--ink); }
.relic.r-boss { background: radial-gradient(circle at 35% 30%, #ffe4d8, #e0705a 45%, var(--verm) 85%); color: #fff3d0; }
.relic.r-rare { background: radial-gradient(circle at 35% 30%, #e8f0ff, #7a9ad6 45%, var(--lapis) 85%); color: #fff3d0; }
.relic.r-uncommon { background: radial-gradient(circle at 35% 30%, #e7fff2, #78b49b 45%, var(--verd) 85%); color: #fff3d0; }
.relic.big { width: 64px; height: 64px; font-size: 34px; border-width: 2px; }
.relic.big .ic { width: 42px; height: 42px; }
.relic.fire { animation: relicFire .6s ease-out; }

/* ---------- title ---------- */
.title { justify-content: center; align-items: center; gap: 8px; text-align: center; padding: 8px 10px 14px; overflow-y: auto; }
.title .logo { font-family: var(--f-logo); font-size: clamp(48px, 15vw, 64px); line-height: .95; color: var(--ink); position: relative; }
.title .logo .cap { color: var(--vermT); font-size: 1.25em; text-shadow: 0 0 0 transparent; }
.title .knight { width: min(150px, calc(var(--vh, 1dvh) * 22)); height: min(150px, calc(var(--vh, 1dvh) * 22)); margin: 0 auto; animation: bob 4s ease-in-out infinite; }
.title .btns { display: flex; flex-direction: column; gap: 9px; width: min(300px, 86vw); margin-top: 6px; }
.title .row2 { display: flex; gap: 9px; }
.title .row2 .btn { flex: 1; }
.title .daily { font-size: 12px; font-family: var(--f-body); font-style: italic; display: block; letter-spacing: 0; opacity: .85; }
.title .foot { font-size: 13px; color: var(--faded); font-style: italic; margin-top: 4px; }
.title .tr { position: absolute; top: 0; right: -6px; }
.title .ribbon { font-family: var(--f-sc); font-size: 14px; color: var(--vermT); letter-spacing: .1em; }

/* ---------- act intro ---------- */
.intro { justify-content: center; align-items: center; text-align: center; padding: 24px 18px; cursor: pointer; }
.intro .frame { position: relative; padding: 34px 20px 26px; width: min(340px, 100%);
  border: 3px double var(--verm); outline: 1px solid var(--gold); outline-offset: 5px; background: rgba(255,248,228,.35); }
.intro .frame::before, .intro .frame::after { content: '\2767'; position: absolute; font-size: 26px; color: var(--gold); }
.intro .frame::before { top: -18px; left: 50%; transform: translateX(-50%); background: var(--p1); padding: 0 6px; }
.intro .frame::after { bottom: -18px; left: 50%; transform: translateX(-50%) rotate(180deg); background: var(--p2); padding: 0 6px; }
.intro .quire { font-family: var(--f-sc); color: var(--vermT); letter-spacing: .25em; font-size: 16px; }
.intro .num { font-family: var(--f-sc); font-size: 84px; line-height: 1; margin: 6px auto; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center;
  color: var(--lapis); background: linear-gradient(135deg, var(--goldhi), var(--gold) 55%, var(--golddk)); border: 2px solid var(--ink); box-shadow: inset 0 0 0 4px rgba(255,240,190,.5), 2px 3px 0 rgba(42,31,26,.3); }
.intro .actname { font-family: var(--f-black); font-size: 36px; line-height: 1.05; margin: 10px 0 8px; }
.intro .tap { margin-top: 26px; font-style: italic; color: var(--faded); animation: breathe 2.4s ease-in-out infinite; }
.intro .vines { width: 100%; height: 28px; color: var(--verdT); opacity: .8; }

/* ---------- map ---------- */
.mapwrap { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; position: relative; margin: 0 -12px; overscroll-behavior: contain; }
.mapwrap::-webkit-scrollbar { display: none; }
.map { position: relative; margin: 0 auto; width: 100%; }
.map svg.paths { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.map .path { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1 7; opacity: .55; }
.map .path.done { stroke-dasharray: none; opacity: .85; stroke-width: 2.6; }
.map .path.open { stroke: var(--verm); opacity: .9; stroke-dasharray: 2 6; animation: dashflow 1.2s linear infinite; }
.node { position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 40% 35%, #fbf2da, var(--p1) 60%, var(--p3)); border: 2px solid var(--ink); color: var(--ink); cursor: pointer; z-index: 1;
  box-shadow: 1px 2px 0 rgba(42,31,26,.3); }
.node .ic { width: 30px; height: 30px; }
.node.t-elite { border-color: var(--verm); color: var(--vermT); }
.node.t-boss { width: 84px; height: 84px; margin: -42px 0 0 -42px; border-width: 3px; border-color: var(--verm); color: var(--vermT);
  background: radial-gradient(circle at 40% 35%, #fff4d6, var(--goldhi) 55%, var(--gold)); }
.node.t-boss .art { width: 70px; height: 70px; }
.node.t-boss .ic { width: 46px; height: 46px; }
.node.t-rest { color: var(--verdT); } .node.t-shop { color: var(--umber); } .node.t-event { color: var(--lapis); } .node.t-treasure { color: var(--golddkT); }
.node.past { opacity: .5; }
.node.visited { opacity: .8; }
.node.visited::after { content: ''; position: absolute; inset: 4px; pointer-events: none;
  background: linear-gradient(45deg, transparent 46%, var(--verm) 46%, var(--verm) 54%, transparent 54%), linear-gradient(-45deg, transparent 46%, var(--verm) 46%, var(--verm) 54%, transparent 54%); opacity: .75; }
.node.here { box-shadow: 0 0 0 4px rgba(184,50,31,.25), 1px 2px 0 rgba(42,31,26,.3); }
.node.reach { border-color: var(--golddk); background: radial-gradient(circle at 40% 35%, #fffbe8, var(--goldhi) 55%, var(--gold)); animation: pulse 1.6s ease-in-out infinite; z-index: 2; }
.node.reach::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 1.5px dashed var(--golddk); animation: spin 9s linear infinite; }
.node .lbl { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-family: var(--f-sc); font-size: 11px; white-space: nowrap; color: var(--faded); margin-top: 1px; }
.node.t-boss .lbl { font-family: var(--f-black); font-size: 15px; color: var(--vermT); }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; font-family: var(--f-sc); font-size: 12px; color: var(--faded); padding: 4px 0 2px; flex: none; border-top: 1px solid rgba(184,50,31,.35); }
.legend span { display: inline-flex; align-items: center; gap: 2px; }
.legend .ic { width: 16px; height: 16px; }
.map .quirehead { position: absolute; left: 0; right: 0; top: 6px; text-align: center; }
.map .quirefoot { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-style: italic; color: var(--faded); font-size: 14px; }
.map .doodle { position: absolute; opacity: .22; width: 60px; height: 60px; pointer-events: none; }

/* ---------- combat ---------- */
.combat { overflow: visible; } /* the hand bleeds into the 12px page gutters; #app clips at the screen edge */
.field { flex: 1; min-height: 0; display: flex; position: relative; }
.margin { width: 58px; flex: none; display: flex; flex-direction: column; justify-content: flex-start; gap: 10px; padding: 22px 0 4px; border-right: 1px solid rgba(184,50,31,.35); position: relative; margin-left: -4px; }
.margin .mtitle { position: absolute; top: 2px; left: 0; right: 4px; text-align: center; font-family: var(--f-sc); font-size: 10px; color: var(--vermT); letter-spacing: .05em; }
.gl { position: relative; min-height: 64px; padding: 4px 4px 4px 2px; font-style: italic; font-size: 11.5px; line-height: 1.05; color: var(--ink2); cursor: pointer;
  border-left: 2px solid var(--pc, var(--faded)); border-radius: 0 4px 4px 0; background: rgba(255,248,228,.35); transform: rotate(-2deg); }
.gl:nth-child(odd) { transform: rotate(1.5deg); }
.gl .gn { display: block; font-family: var(--f-sc); font-style: normal; font-size: 11px; color: var(--pc, var(--ink)); margin-bottom: 1px; }
.gl.empty { border: 1px dashed rgba(107,90,74,.35); background: transparent; color: rgba(107,90,74,.45); text-align: center; display: flex; align-items: center; justify-content: center; font-size: 10px; }
.gl.fire { animation: glossFire .7s ease-out; }
.gl.fresh { animation: inkWrite .9s ease-out both; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.foes { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-around; padding: 4px 0 0 4px; gap: 8px; }
.foe { position: relative; display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 0; max-width: calc(var(--fs, 112px) + 48px); cursor: pointer; transition: transform .2s; padding-top: 2px; }
.foe.sz-m { flex-grow: 1.3; } .foe.sz-l { flex-grow: 1.8; }
.foe .art { width: min(var(--fs, 112px), 100%); height: var(--fs, 112px); position: relative; }
@supports (aspect-ratio: 1) { .foe .art { height: auto; aspect-ratio: 1; } }
.foe.sz-s { --fs: min(100px, calc(var(--vh, 1dvh) * 15)); } .foe.sz-m { --fs: min(132px, calc(var(--vh, 1dvh) * 19)); } .foe.sz-l { --fs: min(172px, calc(var(--vh, 1dvh) * 25)); }
.foes.n2 .foe.sz-m { --fs: min(118px, calc(var(--vh, 1dvh) * 18)); } .foes.n2 .foe.sz-l { --fs: min(140px, calc(var(--vh, 1dvh) * 21)); }
/* crowded rows: width is shared by flex (art shrinks to its share), height still capped by dvh */
.foes.n3 .foe.sz-m, .foes.n4 .foe.sz-m { --fs: min(120px, calc(var(--vh, 1dvh) * 14)); } .foes.n3 .foe.sz-l, .foes.n4 .foe.sz-l { --fs: min(150px, calc(var(--vh, 1dvh) * 16)); }
.foes.n3 .foe.sz-s { --fs: min(104px, calc(var(--vh, 1dvh) * 13)); } .foes.n4 .foe.sz-s { --fs: min(90px, calc(var(--vh, 1dvh) * 11)); }
.foe.targetable .art::after { content: ''; position: absolute; inset: -4px; border: 2px dashed var(--verm); border-radius: 50%; animation: spin 6s linear infinite; opacity: .7; }
.foe.aim .art::after { border-style: solid; border-color: var(--verm); opacity: 1; background: radial-gradient(circle, rgba(184,50,31,.12), transparent 70%); }
.foe .nm { font-family: var(--f-sc); font-size: 12px; line-height: 1.05; text-align: center; color: var(--ink2); max-width: 100%; overflow-wrap: anywhere; }
.intent { display: flex; align-items: center; gap: 1px; height: 26px; padding: 0 6px 0 3px; border-radius: 13px; border: 1.5px solid var(--ink); background: rgba(255,248,228,.85); font-family: var(--f-sc); font-size: 16px; margin-bottom: 2px; white-space: nowrap; box-shadow: 1px 1px 0 rgba(42,31,26,.25); }
.intent .ic { width: 20px; height: 20px; }
.intent .ic + .ic { width: 16px; height: 16px; opacity: .85; }
.intent.atk { border-color: var(--verm); color: var(--vermT); }
.intent.atk b { color: var(--ink); font-weight: 400; }
.intent .x { font-size: 13px; color: var(--faded); }
.intent.pop { animation: chipPop .4s ease-out; }
.bar { position: relative; height: 14px; width: min(var(--bw, 96px), 100%); border: 1.4px solid var(--ink); border-radius: 3px 6px 3px 6px; background: rgba(42,31,26,.12); margin-top: 2px; overflow: visible; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left; background: linear-gradient(180deg, #d4543b, var(--verm) 60%, #8a2212); border-radius: 2px 5px 2px 5px; transition: transform .35s ease-out; }
.bar .ghost { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left; background: rgba(240,210,122,.85); border-radius: 2px 5px 2px 5px; transition: transform .7s .25s ease-out; }
.bar .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-sc); font-size: 12px; color: #fff8e6; text-shadow: 0 0 2px #000, 0 0 3px rgba(0,0,0,.7); line-height: 1; }
.bar.warded { border-color: var(--lapis); box-shadow: 0 0 0 2px rgba(31,79,150,.35); }
.wardb { position: absolute; left: -16px; top: 50%; width: 26px; height: 28px; margin-top: -14px; display: flex; align-items: center; justify-content: center; color: #fff;
  font-family: var(--f-sc); font-size: 13px; z-index: 1; }
.wardb .ic { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--lapis); }
.wardb span { position: relative; text-shadow: 0 0 2px #000; }
.wardb.shim { animation: wardShim .6s ease-out; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 18px; margin-top: 2px; max-width: 130px; }
.foe .chips { max-width: calc(100% + 8px); }
.chip { display: inline-flex; align-items: center; gap: 0; height: 18px; padding: 0 3px 0 1px; border-radius: 9px; font-family: var(--f-sc); font-size: 12px; line-height: 1; border: 1px solid rgba(42,31,26,.5); background: rgba(255,248,228,.8); }
.chip .ic { width: 15px; height: 15px; }
.chip.good { color: var(--verdT); border-color: var(--verd); } .chip.bad { color: var(--vermT); border-color: var(--verm); }
.chip.pop { animation: chipPop .45s ease-out; }
.foe.hit .art, .hero.hit .art { animation: shake .32s ease-out; }
.foe.hit .art svg, .hero.hit .art svg { animation: flash .32s ease-out; }
.foe.acting { animation: lunge .42s ease-in-out; z-index: 2; }
.foe.dying { animation: dissolve .85s ease-in forwards; pointer-events: none; }
.foe.dead { display: none; }
.foe.summoned { animation: inkIn .6s ease-out both; }
.foe .say { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 4; font-family: var(--f-sc); font-size: 14px; color: var(--ink);
  background: #fbf3dc; border: 1.4px solid var(--ink); border-radius: 12px; padding: 2px 8px; animation: sayIn 1.1s ease-out forwards; box-shadow: 1px 2px 0 rgba(42,31,26,.3); pointer-events: none; }
.heroRow { flex: none; display: flex; align-items: flex-end; gap: 6px; padding: 2px 0 2px 4px; min-height: 0; }
.hero { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.hero .art { width: min(136px, calc(var(--vh, 1dvh) * 15)); height: min(136px, calc(var(--vh, 1dvh) * 15)); }
.hero .bar { --bw: 92px; }
.heroSide { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; padding-bottom: 6px; }
.hint { font-style: italic; font-size: 14px; color: var(--faded); text-align: center; min-height: 18px; line-height: 1.15; }
.hint.warn { color: var(--vermT); }
.illum { display: flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 18px; position: relative; cursor: pointer; }
.illum .lab { font-family: var(--f-sc); font-size: 11px; color: var(--faded); position: absolute; top: -12px; left: 0; right: 0; text-align: center; white-space: nowrap; }
.pr { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--pc); position: relative; display: flex; align-items: center; justify-content: center; font-family: var(--f-sc); font-size: 17px; color: var(--pc); background: rgba(255,248,228,.6); transition: background .3s, color .3s, transform .3s; }
.pr.on { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.45), transparent 50%), var(--pc); color: #fff6dc; transform: scale(1.06); }
.pr.gilt { background: radial-gradient(circle at 35% 30%, #fffbe0, var(--goldhi) 45%, var(--gold)); color: var(--pc); border-color: var(--golddk); }
.illum.done { background: radial-gradient(ellipse, rgba(240,210,122,.65), transparent 72%); }
.illum.done .pr { border-color: var(--golddk); box-shadow: 0 0 8px rgba(240,210,122,.9); }
.illum.flaring { animation: illumFlare 1s ease-out; }
.tray { flex: none; height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 2px; position: relative; z-index: 4; }
.pile { width: 46px; height: 54px; border: 0; background: transparent; position: relative; cursor: pointer; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink); }
.pile .ic { width: 28px; height: 28px; }
.pile .n { font-family: var(--f-sc); font-size: 14px; line-height: 1; margin-top: 1px; }
.pile .t { font-family: var(--f-sc); font-size: 9px; color: var(--faded); line-height: 1; }
.pile.bump { animation: chipPop .35s ease-out; }
.inkpot { width: 58px; height: 58px; position: relative; flex: none; }
.inkpot svg { width: 100%; height: 100%; }
.inkpot .v { position: absolute; left: 0; right: 0; top: 23px; text-align: center; font-family: var(--f-black); font-size: 25px; color: #f4e6c4; line-height: 1; text-shadow: 0 1px 0 #000; }
.inkpot .v small { font-size: 13px; opacity: .8; font-family: var(--f-sc); }
.inkpot.bump { animation: chipPop .4s ease-out; }
.inkpot.empty .v { color: var(--rose); }
.seal { /* wax seal End Turn */
  width: 66px; height: 66px; flex: none; border: 0; cursor: pointer; position: relative; padding: 0; margin-right: 2px;
  border-radius: 47% 53% 50% 50% / 52% 46% 54% 48%;
  background: radial-gradient(circle at 38% 32%, #e2604a 0%, #b8321f 38%, #8a1f10 72%, #6b160a 100%);
  box-shadow: 0 3px 0 #4a0e06, 0 5px 8px rgba(42,31,26,.45), inset 0 0 0 5px rgba(120,20,8,.55), inset 0 0 0 7px rgba(255,150,120,.18);
  color: #ffe9d0; font-family: var(--f-sc); font-size: 13px; line-height: 1.02; text-shadow: 0 -1px 0 rgba(0,0,0,.55), 0 1px 0 rgba(255,170,140,.35);
  transition: transform .1s, box-shadow .1s;
}
.seal::before { content: ''; position: absolute; inset: -4px; border-radius: 52% 48% 55% 45% / 45% 55% 47% 53%; background: radial-gradient(circle, transparent 60%, rgba(140,30,15,.85) 61%, rgba(110,20,10,.9) 70%, transparent 72%); z-index: -1; }
.seal:active, .seal.pressed { transform: translateY(3px) scale(.97); box-shadow: 0 0 0 #4a0e06, 0 2px 3px rgba(42,31,26,.45), inset 0 0 0 5px rgba(120,20,8,.55); }
.seal.glow { animation: sealGlow 1.6s ease-in-out infinite; }
.seal[disabled] { filter: grayscale(.7) brightness(.85); }
.hand { flex: none; height: calc(var(--ch) + 24px); position: relative; margin: 0 -12px; z-index: 5; touch-action: none; }

/* ---------- cards ---------- */
.card {
  --pc: var(--faded); --pcl: rgba(107,90,74,.18);
  position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: 6px 8px 6px 8px; padding: 0;
  background:
    radial-gradient(100% 70% at 30% 20%, rgba(255,252,240,.7), transparent 60%),
    var(--grain),
    linear-gradient(170deg, #f7edd3, #ead9b2);
  border: 2.5px solid var(--pc); box-shadow: 0 2px 0 rgba(42,31,26,.35), 0 4px 10px rgba(42,31,26,.25), inset 0 0 0 1.5px rgba(255,250,235,.8), inset 0 0 0 2.5px var(--pcl);
  color: var(--ink); overflow: visible; display: flex; flex-direction: column; touch-action: none; cursor: pointer;
  transition: transform .22s cubic-bezier(.2,.9,.3,1.2), opacity .2s, filter .2s; will-change: transform;
}
.card.p-V { --pc: var(--verm); --pcl: rgba(184,50,31,.25); }
.card.p-L { --pc: var(--lapis); --pcl: rgba(31,79,150,.25); }
.card.p-G { --pc: var(--verd); --pcl: rgba(47,125,98,.25); }
.card.p-A { --pc: var(--gold); --pcl: rgba(201,154,30,.4); }
.card.p-N { --pc: var(--ink2); --pcl: rgba(42,31,26,.2); }
.card.p-X { --pc: #3b3330; --pcl: rgba(42,31,26,.3); background: radial-gradient(60% 45% at 60% 55%, rgba(30,22,18,.28), transparent 70%), var(--grain), linear-gradient(170deg, #e2d4b2, #cdbb92); }
.card.t-curse { --pc: #4b2a4a; }
.card .band { height: 6px; flex: none; background: var(--pc); opacity: .9; border-radius: 3px 5px 0 0; }
.card.p-A .band { background: linear-gradient(90deg, var(--golddk), var(--goldhi), var(--gold), var(--goldhi), var(--golddk)); }
.card .cost { position: absolute; top: -9px; left: -8px; width: 26px; height: 31px; z-index: 2; filter: drop-shadow(0 1px 0 rgba(255,248,228,.9)); }
.card .cost svg { width: 100%; height: 100%; }
.card .cost span { position: absolute; left: 0; right: 0; top: 10px; text-align: center; font-family: var(--f-sc); font-size: 17px; line-height: 1; color: #f7ecd2; }
.card .cost.cheap span { color: var(--goldhi); }
.card .cost.dear span { color: #ffb4a4; }
.card .nm { display: block; padding: 3px 3px 0 13px; min-height: calc(var(--cw) * .27); font-family: var(--f-sc); font-size: calc(var(--cw) * .122); line-height: 1.04; }
.card .nm::after { content: ''; display: block; clear: both; }
.card .dc { /* gold-leaf drop cap */
  float: left; width: 1.95em; height: 1.95em; margin: 1px 3px 0 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--f-body); font-size: 1.15em; color: var(--pc); line-height: 1;
  background: radial-gradient(circle at 30% 25%, #fff8d8, var(--goldhi) 40%, var(--gold) 80%, var(--golddk));
  border: 1px solid var(--golddk); box-shadow: inset 0 0 0 1.5px rgba(255,245,200,.5); border-radius: 1px;
}
.card.p-A .dc { color: var(--lapis); }
.card.p-X .dc { background: #4a3d36; color: #e8dcc0; border-color: #2a1f1a; }
.card .nm .tx { display: block; padding-top: 1px; }
.card .ty { display: flex; align-items: center; justify-content: center; gap: 2px; font-family: var(--f-sc); font-size: calc(var(--cw) * .096); color: var(--pc); line-height: 1; margin: 1px 0; letter-spacing: .04em; }
.card .ty .ic { width: 11px; height: 11px; }
.card .ty::before, .card .ty::after { content: ''; height: 1px; flex: 1; max-width: 16px; background: var(--pc); opacity: .5; }
.card .rt { flex: 1; padding: 1px 5px 4px; font-size: calc(var(--cw) * .112); line-height: 1.13; text-align: center; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.card .rt b { font-family: var(--f-black); font-weight: 400; font-size: 1.12em; }
.card .rt i { color: var(--vermT); }
.card .rt .kw { display: block; font-size: .92em; }
.card .wm { position: absolute; right: 2px; bottom: 2px; width: 28px; height: 28px; opacity: .1; color: var(--pc); pointer-events: none; }
.card.gilt { border-color: var(--gold); box-shadow: 0 2px 0 rgba(42,31,26,.35), 0 4px 10px rgba(42,31,26,.25), inset 0 0 0 1.5px var(--goldhi), inset 0 0 0 3px var(--pc); }
.card.gilt .nm .tx::after { content: '+'; color: var(--golddkT); font-family: var(--f-black); margin-left: 1px; }
.card.dim { filter: saturate(.35) brightness(.88); }
.card.dim .cost span { color: var(--rose); }
.card.sel { z-index: 30 !important; box-shadow: 0 0 0 2px var(--goldhi), 0 0 18px 4px rgba(240,210,122,.85), 0 10px 18px rgba(42,31,26,.4); }
.card.drag { transition: none; z-index: 40 !important; }
.card.deal { animation: dealIn .38s cubic-bezier(.2,.9,.3,1.1) both; }
.card.flying { transition: transform .3s cubic-bezier(.5,0,.75,.4), opacity .3s ease-in; z-index: 45; }
.card.static { position: relative; }
.card.big { --cw: min(220px, 58vw); --ch: calc(var(--cw) * 1.42); border-width: 3.5px; }
.card.big .nm { padding-left: 30px; padding-top: 8px; }
.card.big .cost { width: 44px; height: 52px; top: -14px; left: -14px; }
.card.big .cost span { font-size: 28px; top: 18px; }
.card.big .band { height: 10px; }
.card.big .ty .ic { width: 18px; height: 18px; }
.card.big .wm { width: 64px; height: 64px; }
.card.mid { --cw: min(120px, calc((100vw - 56px) / 3)); --ch: calc(var(--cw) * 1.42); }
.cardFlav { font-style: italic; color: var(--faded); text-align: center; margin: 8px 0 0; font-size: 15px; }
.zoom .cardFlav { color: #f1e3c2; margin: 0; max-width: 320px; text-shadow: 0 1px 2px #000; }

/* ---------- generic content pages ---------- */
.page { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 8px 4px 16px; overscroll-behavior: contain; }
.page::-webkit-scrollbar { display: none; }
.pageHead { text-align: center; padding: 4px 0 2px; }
.pageHead .h-title { font-size: 34px; }
.foot { flex: none; padding: 8px 0 10px; display: flex; gap: 10px; justify-content: center; }
.foot .btn { flex: 1; max-width: 320px; }
.loot { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
.lootItem { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 12px; cursor: pointer; text-align: left; width: 100%;
  border: 1.5px solid var(--ink); border-radius: 4px 10px 5px 9px / 9px 5px 10px 4px; background: rgba(255,248,228,.5); box-shadow: 1px 2px 0 rgba(42,31,26,.3); font-family: var(--f-body); font-size: 17px; }
.lootItem .ic { width: 30px; height: 30px; }
.lootItem.taken { opacity: .4; text-decoration: line-through; pointer-events: none; }
.lootItem small { display: block; color: var(--faded); font-size: 13px; font-style: italic; }
.cardRow { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; }
.cardRow .card { position: relative; }
.cardRow .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cw), 1fr)); gap: 10px 8px; justify-items: center; padding: 6px 2px; }
.grid .card { position: relative; }
.grid .card.chosen { box-shadow: 0 0 0 3px var(--goldhi), 0 0 16px rgba(240,210,122,.9); transform: translateY(-3px); }
.price { display: inline-flex; align-items: center; gap: 2px; font-family: var(--f-sc); font-size: 16px; }
.price .ic { width: 17px; height: 17px; color: var(--faded); }
.price.no { color: var(--vermT); }
.price.sale { color: var(--verdT); }
.tag { font-family: var(--f-sc); font-size: 12px; color: #fff; background: var(--verd); padding: 0 5px; border-radius: 3px; }
.shopSec { margin: 10px 0 2px; font-family: var(--f-sc); color: var(--vermT); text-align: center; letter-spacing: .08em; font-size: 15px; }
.shopItem { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; position: relative; }
.shopItem.sold { opacity: .25; pointer-events: none; }
.shopItem.poor .card, .shopItem.poor .relic { filter: saturate(.4) brightness(.92); }
.relicRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding: 4px 0; }
.relicPick { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100px; text-align: center; cursor: pointer; }
.relicPick .rn { font-family: var(--f-sc); font-size: 14px; line-height: 1.05; }
.relicPick .rt { font-size: 12.5px; line-height: 1.12; color: var(--ink2); }
.relicPick.chosen .relic { box-shadow: 0 0 0 3px var(--goldhi), 0 0 16px rgba(240,210,122,.9); }
.services { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
.services .btn { flex: 1; min-width: 140px; font-size: 15px; }
.services .btn small { display: block; font-family: var(--f-body); font-size: 12px; font-style: italic; letter-spacing: 0; }
.keeper { display: flex; gap: 8px; align-items: center; margin: 2px 4px 6px; font-style: italic; color: var(--faded); font-size: 15px; }
.keeper .art { width: 54px; height: 54px; flex: none; }

/* rest */
.restOpts { display: flex; gap: 12px; justify-content: center; margin: 18px 0; }
.restOpt { flex: 1; max-width: 160px; min-height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px 8px; cursor: pointer;
  border: 2px solid var(--ink); border-radius: 6px 12px 7px 11px / 11px 6px 12px 7px; background: rgba(255,248,228,.55); box-shadow: 2px 3px 0 rgba(42,31,26,.3); text-align: center; font-family: var(--f-body); }
.restOpt:active { transform: translate(1px, 2px); box-shadow: none; }
.restOpt .ic { width: 52px; height: 52px; }
.restOpt .nm { font-family: var(--f-black); font-size: 28px; line-height: 1; }
.restOpt small { font-style: italic; color: var(--faded); font-size: 14px; }
.restOpt.mend { color: var(--verdT); } .restOpt.mend .nm, .restOpt.gild .nm { color: var(--ink); }
.restOpt.gild { color: var(--golddkT); }
.restOpt.off { opacity: .4; pointer-events: none; }
.candle { width: 110px; height: 120px; margin: 4px auto 0; }

/* treasure */
.casket { width: 200px; height: 170px; margin: 18px auto 6px; cursor: pointer; animation: bob 3s ease-in-out infinite; }
.casket.open { animation: none; }
.casket svg { width: 100%; height: 100%; }
.casket .lid { transform-origin: 28px 80px; transition: transform .6s cubic-bezier(.3,1.4,.5,1); }
.casket.open .lid { transform: rotate(-32deg) translate(-2px, -4px); }
.casket .rays { opacity: 0; transition: opacity .6s .2s; }
.casket.open .rays { opacity: 1; }

/* event */
.mini { position: relative; margin: 8px auto 10px; width: min(330px, 100%); padding: 10px;
  border: 3px double var(--lapis); outline: 2px solid var(--gold); outline-offset: 3px;
  background: radial-gradient(circle at 50% 40%, rgba(255,248,226,.9), rgba(233,201,160,.5) 70%), linear-gradient(135deg, rgba(31,79,150,.12), rgba(184,50,31,.12)); }
.mini .scene { height: 120px; display: flex; align-items: center; justify-content: center; color: var(--lapis); position: relative; }
.mini .scene .ic { width: 84px; height: 84px; }
.mini .scene .art { width: 116px; height: 116px; }
.mini .corner { position: absolute; width: 16px; height: 16px; background: var(--verm); border: 2px solid var(--gold); transform: rotate(45deg); }
.mini .corner.tl { top: -9px; left: -9px; } .mini .corner.tr { top: -9px; right: -9px; } .mini .corner.bl { bottom: -9px; left: -9px; } .mini .corner.br { bottom: -9px; right: -9px; }
.evText { font-size: 17px; line-height: 1.32; padding: 2px 6px; }
.evText::first-letter { font-family: var(--f-black); float: left; font-size: 52px; line-height: .85; padding: 6px 6px 0 0; color: var(--vermT); }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.choice { text-align: left; min-height: 52px; padding: 8px 12px; cursor: pointer; border: 1.5px solid var(--ink); border-radius: 4px 10px 5px 9px / 9px 5px 10px 4px; background: rgba(255,248,228,.55); box-shadow: 1px 2px 0 rgba(42,31,26,.3); font-family: var(--f-body); font-size: 16px; line-height: 1.2; width: 100%; }
.choice:active { transform: translate(1px, 2px); box-shadow: none; }
.choice .cl { font-family: var(--f-sc); color: var(--vermT); font-size: 17px; display: block; }
.choice .cd { font-size: 14.5px; color: var(--ink2); }
.choice[disabled] { opacity: .45; }
.choice[disabled] .cl { color: var(--faded); }

/* ---------- keyframes (transform / opacity only on hot paths) ---------- */
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes dlgIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.94); } to { opacity: 1; transform: translate(-50%, -50%); } }
@keyframes zoomIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
@keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dashflow { to { stroke-dashoffset: -16; } }
@keyframes shake { 0% { transform: translateX(0); } 20% { transform: translateX(-7px) rotate(-3deg); } 45% { transform: translateX(6px) rotate(2deg); } 70% { transform: translateX(-3px); } 100% { transform: none; } }
@keyframes flash { 0%, 100% { opacity: 1; } 25% { opacity: .35; } 50% { opacity: 1; } 70% { opacity: .6; } }
@keyframes pageShake { 0%, 100% { transform: none; } 25% { transform: translate(-4px, 2px); } 50% { transform: translate(4px, -2px); } 75% { transform: translate(-2px, 1px); } }
@keyframes lunge { 0%, 100% { transform: none; } 40% { transform: translate(-14px, 10px) scale(1.06); } }
@keyframes dissolve { 0% { opacity: 1; transform: none; } 30% { opacity: .85; transform: scale(1.04) rotate(-2deg); } 100% { opacity: 0; transform: translateY(14px) scale(.75, .4) rotate(4deg); } }
@keyframes inkIn { from { opacity: 0; transform: scale(.3) rotate(-15deg); } to { opacity: 1; transform: none; } }
@keyframes chipPop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes wardShim { 0% { transform: scale(1); opacity: 1; } 35% { transform: scale(1.5) rotate(-8deg); opacity: .8; } 100% { transform: scale(1); opacity: 1; } }
@keyframes relicFire { 0% { transform: scale(1); } 35% { transform: scale(1.4) rotate(12deg); } 100% { transform: scale(1); } }
@keyframes glossFire { 0% { transform: rotate(-2deg) scale(1); } 35% { transform: rotate(0) scale(1.12); background: rgba(240,210,122,.85); } 100% { transform: rotate(-2deg) scale(1); } }
@keyframes inkWrite { 0% { opacity: 0; transform: translateX(-30px) rotate(-8deg); } 60% { opacity: 1; } 100% { opacity: 1; } }
@keyframes illumFlare { 0% { transform: scale(1); } 30% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes sealGlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes dealIn { from { opacity: 0; transform: translate(-160px, 40px) rotate(-30deg) scale(.6); } }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
@keyframes sayIn { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -4px); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -12px); } }
@keyframes banner { 0% { opacity: 0; transform: scaleX(.6); } 20% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 12% { opacity: 1; transform: translate(-50%, 0); } 82% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -6px); } }
@keyframes flare { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6); } }
@keyframes spark { 0% { opacity: 1; transform: translate(0, 0) rotate(45deg) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(225deg) scale(.3); } }
@keyframes blotFly { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; transform: scale(1.1); } 100% { opacity: .1; transform: translate(var(--dx), var(--dy)) scale(.4); } }

<script>/* ==== engine.js ==== */
/* Marginalia — core engine. Pure logic, no DOM. Runs in browser and Node.
   All run state is a plain JSON object (st) so it can be saved/resumed.
   Content lives in M.CARDS, M.ENEMIES, M.RELICS, M.EVENTS, M.ENCOUNTERS (data/*.js). */

  var G = (typeof globalThis !== 'undefined') ? globalThis : window;
  var M = G.M = G.M || {};

  var C = M.CONST = {
    START_HP: 70, START_GOLD: 99, BASE_INK: 3, HAND: 5, HAND_MAX: 10, MARGIN_SLOTS: 3,
    ILLUM_NEED: 3, ROWS: 9, REMOVE_COST: 75, REMOVE_STEP: 25, REST_HEAL: 0.3, ACT_HEAL: 0.5,
    ACTS: 3

  M.STARTER_DECK = ['lance', 'lance', 'lance', 'lance', 'shield', 'shield', 'shield', 'shield', 'moss_dart', 'moss_dart'];
  M.STARTER_RELIC = 'pilgrim_badge';
  M.PIGMENTS = {
    V: { name: 'Vermilion', color: '#b8321f' }, L: { name: 'Lapis', color: '#1f4f96' },
    G: { name: 'Verdigris', color: '#2f7d62' }, A: { name: 'Gold', color: '#c99a1e' },
    N: { name: 'Ink', color: '#2a2320' }, X: { name: 'Blot', color: '#3b3330' }
  };
  M.STATUS = {
    might:    { name: 'Might',    good: true,  desc: 'Attacks deal +N damage per hit.' },
    resolve:  { name: 'Resolve',  good: true,  desc: 'Gain +N Ward whenever you gain Ward from a card.' },
    corrode:  { name: 'Corrode',  good: false, desc: 'At the start of its turn, loses N HP (ignores Ward), then Corrode drops by 1.' },
    smudged:  { name: 'Smudged',  good: false, desc: 'Deals 25% less attack damage. Wears off by 1 each turn.' },
    torn:     { name: 'Torn',     good: false, desc: 'Takes 50% more attack damage. Wears off by 1 each turn.' },
    faded:    { name: 'Faded',    good: false, desc: 'Gains 25% less Ward. Wears off by 1 each turn.' },
    brambles: { name: 'Brambles', good: true,  desc: 'Whenever attacked, the attacker takes N damage.' },
    mending:  { name: 'Mending',  good: true,  desc: 'At the end of its turn, heals N, then Mending drops by 1.' },
    steadfast:{ name: 'Steadfast',good: true,  desc: 'Ward is not removed at the start of turn. Wears off by 1 each turn.' },
    zeal:     { name: 'Zeal',     good: true,  desc: 'At the end of its turn, gains N Might.' },
    shell:    { name: 'Shell',    good: true,  desc: 'At the end of its turn, gains N Ward.' },
    parched:  { name: 'Parched',  good: false, desc: 'Start next turn with N less Ink.' },

  };
  var DECAY = { smudged: 1, torn: 1, faded: 1, mending: 1 };

  // ---------------- RNG ----------------
  function hashStr(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;

      fx(st, { k: 'tick', tgt: 'p', s: 'corrode', n: n });
      loseHp(st, 'p', n); if (c.over) return;
    }
    c.ink = C.BASE_INK + passive(st, 'ink');
    if (p.st.parched) { c.ink = Math.max(0, c.ink - p.st.parched); delete p.st.parched; }
    drawCards(st, C.HAND + passive(st, 'hand')); if (c.over) return;
    if (p.st.petrified) {
      var stones = c.hand.filter(function (x) { return cardCost(st, x) != null; }).sort(function (a, b) { return cardCost(st, b) - cardCost(st, a); }).slice(0, p.st.petrified);
      stones.forEach(function (x) { x.stone = true; fx(st, { k: 'petrify', uid: x.uid }); });
      delete p.st.petrified;

    pend.forEach(function (ops) { if (!c.over) runOps(st, ops, { side: 'p' }); });
    if (c.over) return;
    fireHooks(st, 'turnStart', { turn: c.turn });
    fx(st, { k: 'playerTurn', turn: c.turn });
  }

  function illumNeed(st) { return Math.max(1, C.ILLUM_NEED - passive(st, 'illumEase')); }
  M.illumNeed = illumNeed;
  M.illumProgress = function (st) {
    var c = st.combat; if (!c) return 0;
    return Math.min(illumNeed(st), (c.pig.V > 0) + (c.pig.L > 0) + (c.pig.G > 0) + c.pig.A);
  };

  M.canPlay = function (st, hi) {
    var c = st.combat; if (!c || c.over) return false;
    var inst = c.hand[hi]; if (!inst) return false;
    var d = cardDef(inst), cost = cardCost(st, inst);

  };

  function playCard(st, hi, target) {
    var c = st.combat; if (!c || c.over) return err('No combat');

    var live = living(st);
    var tgtIdx = null;
    if (d.target === 'enemy') {

        if (live.length === 1) target = c.enemies.indexOf(live[0]); else return err('Choose a target');
      }

    }
    c.ink -= cardCost(st, inst);
    c.hand.splice(hi, 1);

    fx(st, { k: 'play', uid: inst.uid, id: inst.id, tgt: tgtIdx != null ? c.enemies[tgtIdx].uid : null });
    if (c.pig[d.pigment] != null) c.pig[d.pigment]++;

    if (c.played > st.stats.maxCardsTurn) st.stats.maxCardsTurn = c.played;

    if (d.type === 'gloss') {

    } else if (d.scrape) { c.scraped.push(inst); fx(st, { k: 'scrape', uid: inst.uid }); }

  }

  function illuminate(st) {

    c.ink += 1;
    drawCards(st, 1);
    if (!c.over) fireHooks(st, 'illuminate', {});
  }

  function endTurn(st) {
    var c = st.combat; if (!c || c.over) return err('No combat');
    if (!c.illum) c.streak = 0;
    var hand = c.hand; c.hand = [];
    hand.forEach(function (inst) {
      delete inst.stone;
      var d = cardDef(inst);

      if (d.fleeting) { c.scraped.push(inst); fx(st, { k: 'scrape', uid: inst.uid }); }
      else c.discard.push(inst);
    });
    if (c.over) return ok();
    fireHooks(st, 'turnEnd', {});
    if (c.over) return ok();
    endOfTurnStatuses(st, 'p');
    if (c.over) return ok();
    fx(st, { k: 'enemyTurn' });
    // enemy turns
    var n0 = c.enemies.length; // enemies summoned during this enemy turn wait until next turn
    for (var i = 0; i < n0; i++) {
      var e = c.enemies[i];

      if ((e.st.corrode || 0) > 0) {
        var n = e.st.corrode; e.st.corrode--; if (!e.st.corrode) delete e.st.corrode;
        fx(st, { k: 'tick', tgt: e.uid, s: 'corrode', n: n });
        loseHp(st, i, n);
        if (c.over) return ok();
        if (e.dead) continue;
      }
      var mv = M.ENEMIES[e.id].moves[e.intent];
      fx(st, { k: 'enemyAct', tgt: e.uid, move: e.intent, name: mv && mv.name });
      if (mv) runOps(st, mv.ops, { side: 'e', ei: i });
      if (c.over) return ok();
    }
    for (i = 0; i < n0; i++) if (!c.enemies[i].dead) { endOfTurnStatuses(st, i); if (c.over) return ok(); }
    // end of round: timed debuffs wear off for everyone (so enemy-applied Torn/Smudged last through the next exchange)
    decayStatuses(st, 'p');
    for (i = 0; i < c.enemies.length; i++) if (!c.enemies[i].dead) decayStatuses(st, i);
    c.enemies.forEach(function (e) { if (!e.dead) chooseIntent(st, e); });
    startPlayerTurn(st);
    return ok();
  }

  function endOfTurnStatuses(st, ref) {
    var a = actor(st, ref);
    if (a.st.mending) heal(st, ref, a.st.mending);
    if (a.st.zeal) applyStatus(st, ref, 'might', a.st.zeal);
    if (a.st.shell) gainWard(st, ref, a.st.shell, false);
  }
  function decayStatuses(st, ref) {
    var a = actor(st, ref);
    Object.keys(DECAY).forEach(function (s) { if (a.st[s]) { a.st[s] -= DECAY[s]; if (a.st[s] <= 0) delete a.st[s]; } });
  }

  // ---------------- Hooks (relics + margin glosses) ----------------
  function hookMatches(h, on, info) {
    if (h.on !== on) return false;
    if (h.pig && h.pig !== info.pig) return false;
    if (h.type && h.type !== info.type) return false;
    if (h.turn && h.turn !== info.turn) return false;
    return true;
  }
  function fireHooks(st, on, info) {
    var c = st.combat;
    st.relics.forEach(function (id) {
      var r = M.RELICS[id]; if (!r || !r.hooks) return;
      r.hooks.forEach(function (h) {
        if ((c && c.over && on !== 'combatEnd') || !hookMatches(h, on, info)) return;
        if (h.every) { var rs = st.relicState[id]; rs.count = (rs.count || 0) + 1; if (rs.count % h.every) return; }
        fx(st, { k: 'relicFire', id: id });
        runOps(st, h.ops, { side: on === 'combatEnd' ? 'run' : 'p', hook: true });
      });
    });
    (st.mods || []).forEach(function (id) {
      var m = M.MODIFIERS && M.MODIFIERS[id]; if (!m || !m.hooks) return;
      m.hooks.forEach(function (h) {
        if ((c && c.over && on !== 'combatEnd') || !hookMatches(h, on, info)) return;
        runOps(st, h.ops, { side: on === 'combatEnd' ? 'run' : 'p', hook: true });
      });
    });
    if (!c || on === 'combatEnd') return;
    c.margin.slice().forEach(function (g) {
      if (c.over) return;
      var d = cardDef(g), hs = d.gloss ? (Array.isArray(d.gloss) ? d.gloss : [d.gloss]) : [];
      hs.forEach(function (h) {
        if (c.over || !hookMatches(h, on, info)) return;
        if (h.every) { g.count++; if (g.count % h.every) return; }
        fx(st, { k: 'glossFire', id: g.id });
        runOps(st, h.ops, { side: 'p', hook: true });
      });
    });
  }

  // ---------------- Effect DSL ----------------
  function resolveTargets(st, ctx, o, def) {
    var t = o.target || def;
    var c = st.combat;
    if (ctx.side === 'p') {
      if (t === 'self') return ['p'];
      if (t === 'all') return c.enemies.map(function (e, i) { return i; }).filter(function (i) { return !c.enemies[i].dead; });
      if (t === 'random' || ctx.target == null || !c.enemies[ctx.target] || c.enemies[ctx.target].dead) {
        var l = c.enemies.map(function (e, i) { return i; }).filter(function (i) { return !c.enemies[i].dead; });
        return l.length ? [pick(st, 'combat', l)] : [];
      }
      return [ctx.target];
    } else {
      if (t === 'self') return [ctx.ei];
      if (t === 'allies') return c.enemies.map(function (e, i) { return i; }).filter(function (i) { return !c.enemies[i].dead; });
      return ['p'];
    }
  }
  function src(ctx) { return ctx.side === 'p' ? 'p' : ctx.ei; }

  function perValue(st, ctx, per, tref) {
    var c = st.combat, p = c.player;
    switch (per) {
      case 'targetCorrode': return tref != null ? stv(st, tref, 'corrode') : 0;
      case 'ward': return actor(st, src(ctx)).ward;
      case 'played': return ctx.playedBefore != null ? ctx.playedBefore : c.played;
      case 'margin': return c.margin.length;
      case 'pigments': return (c.pig.V > 0) + (c.pig.L > 0) + (c.pig.G > 0) + (c.pig.A > 0);
      case 'handSize': return c.hand.length;
      case 'discard': return c.discard.length;
      case 'might': return p.st.might || 0;
      case 'blots': return c.hand.concat(c.draw, c.discard).filter(function (i) { var d = cardDef(i); return d.type === 'blot' || d.type === 'curse'; }).length;
      case 'missingHp': return st.maxHp - st.hp;
      default: return 0;
    }
  }

  function cond(st, ctx, s) {
    var c = st.combat, parts = String(s).split(':'), k = parts[0], v = parts[1];
    switch (k) {
      case 'illuminated': return !!(c && c.illum);
      case 'played': return !!(c && (ctx.pigBefore || c.pig)[v] > 0);
      case 'targetCorroded': return ctx.target != null && stv(st, ctx.target, 'corrode') > 0;
      case 'targetTorn': return ctx.target != null && stv(st, ctx.target, 'torn') > 0;
      case 'targetAttacking': if (ctx.target == null) return false; return M.intentInfo(st, c.enemies[ctx.target]).kinds.indexOf('attack') >= 0;
      case 'wardAtLeast': return c.player.ward >= +v;
      case 'hpBelowHalf': return st.hp <= st.maxHp / 2;
      case 'marginFull': return c.margin.length >= marginSlots(st);
      case 'firstCard': return (ctx.playedBefore != null ? ctx.playedBefore : c.played) === 0;
      case 'handEmpty': return c.hand.length === 0;
      case 'goldAtLeast': return st.gold >= +v;
      default: return false;
    }
  }

  function runOps(st, ops, ctx) {
    if (!ops) return;
    for (var i = 0; i < ops.length; i++) {
      var c = st.combat;
      if (c && c.over && ctx.side !== 'run') return;
      runOp(st, ops[i], ctx);
    }
  }
  M.runOps = runOps;

  function runOp(st, o, ctx) {
    var c = st.combat, s = src(ctx), times, i, ts;
    switch (o.op) {
      case 'dmg':
      case 'dmgPer':
        times = o.times || 1;
        for (i = 0; i < times; i++) {
          if (c.over) return;
          ts = resolveTargets(st, ctx, o, 'enemy');
          ts.forEach(function (t) {
            var base = o.op === 'dmg' ? o.n : (o.base || 0) + (o.mult || 1) * perValue(st, ctx, o.per, t);
            dealDamage(st, s, t, base, true);
          });
          checkEnd(st);
        }
        break;
      case 'ward':
        resolveTargets(st, ctx, o, 'self').forEach(function (t) { gainWard(st, t, o.n, ctx.side === 'p'); }); break;
      case 'wardPer':
        gainWard(st, s, (o.base || 0) + (o.mult || 1) * perValue(st, ctx, o.per, ctx.target), ctx.side === 'p'); break;
      case 'apply':
        resolveTargets(st, ctx, o, ctx.side === 'p' ? 'enemy' : 'player').forEach(function (t) { applyStatus(st, t, o.s, o.n); }); break;
      case 'doubleStatus':
        resolveTargets(st, ctx, o, 'enemy').forEach(function (t) { var v = stv(st, t, o.s); if (v > 0) applyStatus(st, t, o.s, v * ((o.mult || 2) - 1)); }); break;
      case 'removeStatus':
        resolveTargets(st, ctx, o, 'self').forEach(function (t) { var a = actor(st, t); if (a.st[o.s]) { delete a.st[o.s]; fx(st, { k: 'status', tgt: t === 'p' ? 'p' : c.enemies[t].uid, s: o.s, n: 0 }); } }); break;
      case 'draw': if (c) drawCards(st, o.n); break;
      case 'drawPigment':
        for (i = 0; i < o.n; i++) {
          var idx = -1;
          for (var j = c.draw.length - 1; j >= 0; j--) if (cardDef(c.draw[j]).pigment === o.pig) { idx = j; break; }
          if (idx < 0 || c.hand.length >= C.HAND_MAX) break;
          var inst = c.draw.splice(idx, 1)[0]; c.hand.push(inst); fx(st, { k: 'draw', uid: inst.uid });
        }
        break;
      case 'ink': if (c) { c.ink += o.n; fx(st, { k: 'ink', n: o.n }); } break;
      case 'heal':
        if (ctx.side === 'run' || !c) { var b = st.hp; st.hp = Math.min(st.maxHp, st.hp + o.n); fx(st, { k: 'heal', tgt: 'p', n: st.hp - b }); }
        else if (o.target === 'allies') resolveTargets(st, ctx, o, 'allies').forEach(function (t) { heal(st, t, o.n); });
        else heal(st, s, o.n);
        break;
      case 'loseHp':
        if (ctx.side === 'run' || !c) { st.hp = Math.max(1, st.hp - o.n); fx(st, { k: 'loseHp', tgt: 'p', n: o.n }); }
        else loseHp(st, s, o.n);
        break;
      case 'addCard':
        var n = o.n || 1;
        for (i = 0; i < n; i++) {
          if (!c || ctx.side === 'run') { addToDeck(st, o.id, o.up); fx(st, { k: 'gainCard', id: o.id }); continue; }
          var ni = { uid: -(st.nextUid++), id: o.id, up: !!o.up, tmp: true };
          var to = o.to || 'discard';
          if (to === 'hand' && c.hand.length < C.HAND_MAX) c.hand.push(ni);
          else if (to === 'draw') c.draw.splice(rint(st, 'combat', 0, c.draw.length), 0, ni);
          else c.discard.push(ni);
          fx(st, { k: 'addCard', id: o.id, to: to });
        }
        break;
      case 'scrapeBlots':
        var blots = c.hand.filter(function (x) { var d = cardDef(x); return d.type === 'blot' || d.type === 'curse'; });
        c.hand = c.hand.filter(function (x) { return blots.indexOf(x) < 0; });
        blots.forEach(function (x) { c.scraped.push(x); fx(st, { k: 'scrape', uid: x.uid }); });
        if (o.draw && blots.length) drawCards(st, blots.length);
        break;
      case 'gildHand':
        var cand = c.hand.filter(function (x) { return !x.up && M.CARDS[x.id].up; });
        shuffle(st, 'combat', cand);
        cand.slice(0, o.n === 'all' ? cand.length : (o.n || 1)).forEach(function (x) { x.up = true; fx(st, { k: 'gild', uid: x.uid }); });
        break;
      case 'costHand': // set cost of random card(s) in hand to n for this combat
        var cc = c.hand.filter(function (x) { var cs = cardCost(st, x); return cs != null && cs > o.n; });
        shuffle(st, 'combat', cc);
        cc.slice(0, o.count || 1).forEach(function (x) { x.costTmp = o.n; fx(st, { k: 'gild', uid: x.uid }); });
        break;
      case 'createCard': // conjure random card(s) from this character's pool into a pile, temporary for the fight
        for (i = 0; i < (o.n || 1); i++) {
          var cr = o.rarity ? [o.rarity] : ['common', 'uncommon', 'rare'];
          var cp = []; cr.forEach(function (r) { cp = cp.concat(cardPool(r, st, { pig: o.pig, type: o.type })); });
          if (!cp.length) break;
          var cid2 = pick(st, 'combat', cp);
          var ci = { uid: -(st.nextUid++), id: cid2, up: !!o.up, tmp: true };
          if (o.cost != null) ci.costTmp = o.cost;
          var to2 = o.to || 'hand';
          if (to2 === 'hand' && c.hand.length < C.HAND_MAX) c.hand.push(ci);
          else if (to2 === 'draw') c.draw.splice(rint(st, 'combat', 0, c.draw.length), 0, ci);
          else c.discard.push(ci);
          seeCard(st, cid2);
          fx(st, { k: 'addCard', id: cid2, to: to2 });
        }
        break;
      case 'echoMargin': // every Gloss in the Margin fires its effects once more
        c.margin.slice().forEach(function (g) {
          var gd = cardDef(g), hs = gd.gloss ? (Array.isArray(gd.gloss) ? gd.gloss : [gd.gloss]) : [];
          hs.forEach(function (h) { if (!c.over) { fx(st, { k: 'glossFire', id: g.id }); runOps(st, h.ops, { side: 'p', hook: true }); } });
        });
        break;
      case 'if':
        runOps(st, cond(st, ctx, o.cond) ? o.then : (o.else || []), ctx); break;
      case 'repeat':
        for (i = 0; i < o.n; i++) runOps(st, o.ops, ctx); break;
      case 'nextTurn': if (c) c.pending.push(o.ops); break;
      case 'gold': st.gold = Math.max(0, st.gold + o.n); fx(st, { k: 'gold', n: o.n }); break;
      case 'eraseMargin':
        for (i = 0; i < (o.n || 1) && c.margin.length; i++) { var g = c.margin.pop(); c.scraped.push({ uid: g.uid, id: g.id, up: g.up }); fx(st, { k: 'erase', id: g.id }); }
        break;
      case 'devour':
        for (i = 0; i < (o.n || 1) && c.draw.length; i++) { var k2 = rint(st, 'combat', 0, c.draw.length - 1); var dv = c.draw.splice(k2, 1)[0]; c.scraped.push(dv); fx(st, { k: 'devour', id: dv.id }); }
        break;
      case 'devourPigment': // scrape random cards of one pigment from the player's draw pile
        for (i = 0; i < (o.n || 1); i++) {
          var dp = c.draw.map(function (x, k) { return k; }).filter(function (k) { return cardDef(c.draw[k]).pigment === o.pig; });
          if (!dp.length) break;
          var dpk = pick(st, 'combat', dp), dv2 = c.draw.splice(dpk, 1)[0]; c.scraped.push(dv2); fx(st, { k: 'devour', id: dv2.id });
        }
        break;
      case 'summon':
        if (living(st).length < (o.max || 4)) {
          var ne = makeEnemy(st, o.id); c.enemies.push(ne);
          var d2 = M.ENEMIES[o.id]; if (d2.start) runOps(st, d2.start, { side: 'e', ei: c.enemies.length - 1 }); enemyExtras(st, c.enemies.length - 1);
          chooseIntent(st, ne); fx(st, { k: 'summon', tgt: ne.uid });
        }
        break;
      // ----- run-level ops (events, relic pickups) -----
      case 'maxHp': st.maxHp += o.n; if (o.n > 0) st.hp += o.n; st.hp = Math.min(st.hp, st.maxHp); fx(st, { k: 'maxHp', n: o.n }); break;
      case 'gainCard': // {rarity} or {id}
        var cid = o.id || randomCardIds(st, 'event', 1, o.rarity ? (function () { var w = {}; w[o.rarity] = 1; return w; })() : null)[0];
        if (cid) { addToDeck(st, cid, o.up); fx(st, { k: 'gainCard', id: cid }); }
        break;
      case 'relic':
        var rid = o.id || randomRelic(st, 'event', o.rarity ? (function () { var w = {}; w[o.rarity] = 1; return w; })() : null);
        if (rid) gainRelic(st, rid); else { st.gold += 50; fx(st, { k: 'gold', n: 50 }); }
        break;
      case 'gildRandom':
        var gc = st.deck.filter(function (x) { return !x.up && M.CARDS[x.id].up; });
        shuffle(st, 'event', gc);
        gc.slice(0, o.n || 1).forEach(function (x) { x.up = true; fx(st, { k: 'gildDeck', uid: x.uid }); });
        break;
      case 'removeRandom':
        for (i = 0; i < (o.n || 1); i++) {
          var rc = st.deck.filter(function (x) { return M.CARDS[x.id].type !== 'curse'; });
          if (rc.length <= 5) break;
          var rr = pick(st, 'event', rc); st.deck.splice(st.deck.indexOf(rr), 1); fx(st, { k: 'removeCard', id: rr.id });
        }

      case 'choose': // open pick screen: o.purpose = remove|gild|transform|duplicate
        st.pick = { purpose: o.purpose, back: st.screen, free: true };
        st.screen = 'pick';
        break;
      case 'fight':

        break;
      default:
        if (typeof console !== 'undefined') console.warn('Unknown op', o.op);
    }
  }

  // ---------------- Rewards / loot ----------------
  function cardPool(rarity, st, f) {
    return Object.keys(M.CARDS).filter(function (id) {
      var d = M.CARDS[id];
      if (d.rarity !== rarity || (st && !cardAvail(st, id))) return false;
      if (f && f.pig && d.pigment !== f.pig) return false;
      if (f && f.type && d.type !== f.type) return false;
      return true;
    });

   and leans on Gold leaf for Illumination. All ids are prefixed scr_.

   - No Gloss hook ever contains echoMargin (a Gloss echoing the Margin would echo itself forever).

    }).join('') + '</div>';

    if (saved && !locked) h = h.replace('</div><div class="foot">', '<div class="flavor warnSave">Beginning anew will scrape thy unfinished run.</div></div><div class="foot">');
    return h + '</div>';
  }
  function rubPickerHtml(ch, asc) {
    var R = M.RUBRICS || [], max = rubMax(ch);

    var best = book.best[ch + ':' + asc];
    return '<div class="rubPick"><div class="shopSec">Rubrication</div>' +
      '<div class="rubStep"><button class="ib' + (asc <= 0 ? ' off' : '') + '" data-a="rubDown" aria-label="Lower Rubrication">‹</button>' +
      '<div class="rubCur" data-a="rubAll" role="button" aria-label="All Rubrication levels"><span class="rubNum">' + rn(asc) + '</span><b>' + esc(rubName(asc)) + '</b><small>Score ' + multOf(asc, 0) + (best ? ' · thy best ' + best : '') + '</small></div>' +
      '<button class="ib' + (asc >= max ? ' off' : '') + '" data-a="rubUp" aria-label="Raise Rubrication">›</button></div>' +
      (asc ? '<ol class="rubRules">' + rules + '</ol>' : '<div class="flavor" style="font-size:14px">The book as the scribe intended it. No added rules.</div>') +
      (max < R.length ? '<div class="rubNext">' + icon('lock') + ' Rubrication ' + roman(max + 1) + ' unlocks when thou closest the book ' + (max ? 'at ' + roman(max) : 'on plain vellum') + ' with this hand.</div>' : '') +
      '<div style="text-align:center"><button class="btn ghost small" data-a="rubAll">All levels</button></div></div>';
  }
  function showRubAll() {
    var cs = ui.cs, R = M.RUBRICS || [], max = rubMax(cs.char), rows = '';
    for (var i = 0; i <= R.length; i++) {
      var lk = i > max, best = book.best[cs.char + ':' + i];
      rows += '<button class="rubRow' + (i === cs.asc ? ' on' : '') + (lk ? ' locked' : '') + '" data-a="rubSet" data-n="' + i + '"' + (lk ? ' aria-disabled="true"' : '') + '>' +
        '<span class="rubNum">' + rn(i) + '</span><span class="rx"><b>' + esc(rubName(i)) + '</b><span>' + esc(i ? R[i - 1].desc : 'No added rules.') + '</span>' +
        '<small>' + (i > 1 ? 'Plus every rule above · ' : '') + 'score ' + multOf(i, 0) + (best ? ' · best ' + best : '') + '</small></span>' + (lk ? icon('lock') : '') + '</button>';

  // ----- act intro

        (st.asc ? '<div class="ir"><span class="rubNum">' + roman(st.asc) + '</span><span><b>Rubrication ' + st.asc + '</b> — ' + esc(rubName(st.asc)) + '</span></div>' : '') +
        (st.mods || []).map(function (id) { var m = modDef(id); return '<div class="ir"><span class="wax">' + esc(m.name.charAt(0)) + '</span><span><b>' + esc(m.name) + '</b> — ' + esc(m.desc) + '</span></div>'; }).join('') +

  function vineSvg(flip) {
    return '<svg class="vines" viewBox="0 0 300 28" preserveAspectRatio="none" style="' + (flip ? 'transform:scaleY(-1)' : '') + '">' +
      '<path d="M10 14c30-16 50 16 80 0s50-16 60 0 30 16 60 0 50-16 80 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
      [40, 110, 190, 260].map(function (x, i) { return '<path d="M' + x + ' ' + (i % 2 ? 18 : 10) + 'c6-8 14-8 16 0-6 4-12 4-16 0z" fill="#2f7d62" fill-opacity=".7" stroke="#2a1f1a" stroke-width="1"/>'; }).join('') +
      '<circle cx="150" cy="14" r="5" fill="#b8321f" stroke="#2a1f1a" stroke-width="1.2"/></svg>';
  }

  // ----- map
  function renderMap() {
    var rows = st.map.rows, R = rows.length, rowH = 92, padTop = 150, padBot = 86;
    var H = padTop + (R - 1) * rowH + padBot;
    var reach = M.reachable(st), cur = st.pos ? M.findNode(st, st.pos) : null, curRow = cur ? cur.r : -1;
    var X = function (n) { return 8 + n.x * 84; }, Y = function (n) { return padTop + (R - 1 - n.r) * rowH; };
    var paths = '';
    rows.forEach(function (row) {
      row.forEach(function (n) {
        n.next.forEach(function (id) {
          var m = M.findNode(st, id); if (!m) return;
          var x1 = X(n), y1 = Y(n), x2 = X(m), y2 = Y(m), hs = hash(n.id + id);
          var mx = (x1 + x2) / 2 + ((hs % 7) - 3) * 0.9, my = (y1 + y2) / 2 + ((hs % 5) - 2) * 4;
          var cls = (n.visited && m.visited) ? 'done' : (st.pos === n.id && reach.indexOf(id) >= 0) ? 'open' : '';
          paths += '<path class="path ' + cls + '" vector-effect="non-scaling-stroke" d="M' + x1.toFixed(2) + ' ' + (y1 - 22) + ' Q' + mx.toFixed(2) + ' ' + my + ' ' + x2.toFixed(2) + ' ' + (y2 + (m.type === 'boss' ? 40 : 24)) + '"/>';
        });
      });
    });
    var nodes = '';
    rows.forEach(function (row) {
      row.forEach(function (n) {
        var cls = ['node', 't-' + n.type];
        if (n.visited) cls.push('visited');
        if (st.pos === n.id) cls.push('here');
        if (reach.indexOf(n.id) >= 0) cls.push('reach');
        else if (n.r <= curRow && !n.visited) cls.push('past');
        var inner;
        if (n.type === 'boss') {
          var bs = bossIds();
          if (bs.length > 1) cls.push('duo');
          inner = bs.length ? bs.slice(0, 2).map(function (b) { return '<div class="art">' + artSvg(b) + '</div>'; }).join('') : icon('node_boss');
          inner += '<span class="lbl">' + esc(bossNames()) + '</span>';
        } else inner = icon('node_' + n.type) + (reach.indexOf(n.id) >= 0 ? '<span class="lbl">' + NODE_NAMES[n.type] + '</span>' : '');
        nodes += '<button class="' + cls.join(' ') + '" style="left:' + X(n).toFixed(2) + '%;top:' + Y(n) + 'px" data-a="node" data-id="' + n.id + '" aria-label="' + NODE_NAMES[n.type] + '">' + inner + '</button>';
      });
    });
    var doodles = '';
    for (var d = 0; d < 4; d++) {
      var y = padTop + 40 + d * rowH * 2.1, left = d % 2 ? 'right:-14px' : 'left:-14px';
      doodles += '<svg class="doodle" style="top:' + y + 'px;' + left + '" viewBox="0 0 60 60"><path d="M30 58C30 40 10 36 14 20s22-10 18 4-14 8-12-2" fill="none" stroke="#2f7d62" stroke-width="2.5" stroke-linecap="round"/><path d="M14 20c-8-2-10-10-4-12 4 4 6 8 4 12z" fill="#2f7d62"/><circle cx="32" cy="26" r="4" fill="#b8321f"/></svg>';
    }
    var bs = bossIds(), CH = charDef(st.char);
    var mapbar = '<div class="mapbar">' +
      '<button class="warden" data-a="bossInfo" aria-label="Guarding this Quire: ' + esc(bossNames()) + '"><span class="wa">' + (bs.length ? bs.slice(0, 2).map(function (b) { return '<span class="art">' + artSvg(b) + '</span>'; }).join('') : icon('node_boss')) + '</span>' +
      '<span class="wt"><small>Guarding the binding</small>' + esc(bossNames()) + '</span></button>' +
      (st.asc ? '<button class="sealBtn" data-a="rubInfo" aria-label="Rubrication ' + st.asc + '"><span class="wax rub">' + roman(st.asc) + '</span></button>' : '') +
      (st.mods || []).map(function (id) { return '<button class="sealBtn" data-a="modInfo" data-id="' + esc(id) + '" aria-label="Modifier: ' + esc(modDef(id).name) + '"><span class="wax">' + esc(modDef(id).name.charAt(0)) + '</span></button>'; }).join('') +
      '</div>';
    return '<div class="scr mapscr enter">' + hudHtml() + mapbar +
      '<div class="mapwrap" id="mapwrap"><div class="map" style="height:' + H + 'px">' +
      '<div class="quirehead"><div class="h-sub">Quire ' + (ACTS[st.act] || ACTS[1]).roman + (st.asc ? ' · Rubrication ' + roman(st.asc) : '') + '</div><div class="h-title" style="font-size:26px">' + esc(quireName(st.act)) + '</div>' +
      ((st.mods || []).length ? '<div class="qmods">' + st.mods.map(function (id) { return esc(modDef(id).name); }).join(' · ') + '</div>' : '') + '</div>' +
      doodles +
      '<svg class="paths" viewBox="0 0 100 ' + H + '" preserveAspectRatio="none">' + paths + '</svg>' + nodes +
      '<div class="quirefoot">' + (st.pos ? (st.char === 'knight' ? 'Ride on, Sir Knight.' : 'Onward, ' + esc(CH.short || CH.name) + '.') : 'Begin at the foot of the page.') + '</div>' +
      '</div></div>' +
      '<div class="legend">' + ['battle', 'elite', 'event', 'shop', 'rest', 'treasure'].map(function (t) { return '<span>' + icon('node_' + t) + NODE_NAMES[t] + '</span>'; }).join('') + '</div>' +
      '</div>';
  }
  function bossIds() { var b = st && st.map && st.map.boss; return (Array.isArray(b) ? b : b ? [b] : []).filter(function (id) { return M.ENEMIES[id]; }); }
  function bossNames() {
    var bs = bossIds(); if (!bs.length) return 'The Boss';
    var names = []; bs.forEach(function (id) { var n = M.ENEMIES[id].name; if (names.indexOf(n) < 0) names.push(n); });
    return names.join(' & ');
  }
  function showBossInfo() {
    var bs = bossIds(), seenB = {}; if (!bs.length) return;
    var body = bs.filter(function (id) { if (seenB[id]) return false; seenB[id] = 1; return true; }).map(function (id) {
      var d = M.ENEMIES[id];

    }).join('<div class="rule"></div>');

  }
  function afterMap() {

  }

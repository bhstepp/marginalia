<script>(function(){var d=document.documentElement,sa=false;
try{sa=!!(navigator.standalone||matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches)}catch(e){}
if(sa)d.classList.add("standalone");
/* Home-Screen web apps on iOS report a viewport as if Safari's toolbar were still there; size from the real screen instead. */
function v(){var h=innerHeight;if(sa&&screen&&screen.height){var port=innerHeight>=innerWidth,sh=port?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);if(sh>h)h=sh}
d.style.setProperty("--app-h",h+"px");d.style.setProperty("--vh",(h/100)+"px")}
v();addEventListener("resize",v);addEventListener("orientationchange",function(){setTimeout(v,300)})})();</script>
